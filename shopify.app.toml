# Cellexia Interstitial Page Builder — Shopify app configuration
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
#
# `client_id`, `application_url` and `redirect_urls` are filled in by
# `shopify app config link` (or `shopify app dev`) once the app is created in the
# Partner Dashboard / Dev Dashboard for the Cellexia Labs store.

client_id = "REPLACE_WITH_CLIENT_ID"
name = "Cellexia Interstitial Builder"
handle = "cellexia-interstitial-builder"
application_url = "https://REPLACE_WITH_APP_URL"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# read_products   → product/variant picker + live prices in the admin preview
# read_files/write_files → image uploads to Shopify Files (CDN) from the editor
# read_locales/read_markets → language + market lists for translations/overrides
# read_discounts/write_discounts → validate/create funnel discount codes from the admin
scopes = "read_products,read_files,write_files,read_locales,read_markets,read_discounts,write_discounts,read_themes"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_APP_URL/auth/callback",
  "https://REPLACE_WITH_APP_URL/auth/shopify/callback",
  "https://REPLACE_WITH_APP_URL/api/auth/callback"
]

# The App Proxy is what makes pages render on the store's own domain, inside the
# store's real theme layout (header + footer), on a legacy/vintage theme:
#   https://cellexialabs.com/a/go/<page-slug>
[app_proxy]
url = "https://REPLACE_WITH_APP_URL/proxy"
subpath = "go"
prefix = "a"

[pos]
embedded = false
