<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The pigment switch: normal vs stuck on (Melanin Overdrive)">
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="Inter, Arial, sans-serif" fill="#1D1D1B">
    <text x="600" y="70" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="3">THE PIGMENT SWITCH (TYROSINASE)</text>
    <text x="300" y="130" text-anchor="middle" font-size="26" font-weight="700">Healthy skin</text>
    <text x="300" y="158" text-anchor="middle" font-size="16" fill="#555">Switch turns on when needed — and off again</text>
    <text x="900" y="130" text-anchor="middle" font-size="26" font-weight="700" fill="#8A3B45">Melanin Overdrive</text>
    <text x="900" y="158" text-anchor="middle" font-size="16" fill="#555">Switch stuck ON — patches keep producing pigment</text>
  </g>
  <g transform="translate(180 200)">
    <rect x="0" y="0" width="240" height="110" rx="55" fill="#DDE3E8"/>
    <circle cx="55" cy="55" r="45" fill="#FFFFFF" stroke="#B9C2CB" stroke-width="3"/>
    <text x="150" y="63" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#556">OFF</text>
  </g>
  <g transform="translate(120 360)">
    <rect x="0" y="0" width="360" height="200" rx="18" fill="#F4D6C6"/>
    <g fill="#E1B29E" opacity=".6"><circle cx="70" cy="60" r="6"/><circle cx="160" cy="130" r="5"/><circle cx="270" cy="70" r="6"/><circle cx="220" cy="160" r="4"/></g>
    <text x="180" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555">Pigment stays even; marks fade and clear</text>
  </g>
  <g transform="translate(780 200)">
    <rect x="0" y="0" width="240" height="110" rx="55" fill="#B23A48"/>
    <circle cx="185" cy="55" r="45" fill="#FFFFFF" stroke="#8A3B45" stroke-width="3"/>
    <text x="90" y="63" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFF">ON</text>
    <g stroke="#B23A48" stroke-width="4" stroke-linecap="round"><path d="M250 30l24-14"/><path d="M256 55h28"/><path d="M250 80l24 14"/></g>
  </g>
  <g transform="translate(720 360)">
    <rect x="0" y="0" width="360" height="200" rx="18" fill="#F4D6C6"/>
    <g fill="#8B5A3C" opacity=".85"><circle cx="70" cy="60" r="16"/><circle cx="150" cy="120" r="22"/><circle cx="260" cy="70" r="18"/><circle cx="300" cy="150" r="14"/><circle cx="210" cy="40" r="10"/><circle cx="90" cy="150" r="11"/></g>
    <text x="180" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#555">Overproduction outruns clearing — spots come back</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D1D1B">
    <rect x="150" y="610" width="900" height="44" rx="22" fill="#EEF4FA"/>
    <text x="600" y="638" text-anchor="middle" letter-spacing="1.5">FOUR PATHWAYS: BLOCK · NEUTRALIZE · CALM · BRIGHTEN</text>
  </g>
</svg>
